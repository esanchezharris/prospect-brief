[project]
name = "prospect-brief"
version = "0.1.0"
description = "Source-cited donor briefing generator with a signal-watch module. Public sources only."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pypdf>=5.0",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "lxml>=5.2",
]

[project.scripts]
prospect-brief = "prospect_brief.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prospect_brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
